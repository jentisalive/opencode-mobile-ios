name: OpenCode
options:
  bundleIdPrefix: app.ocmobile
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  OpenCode:
    type: application
    platform: iOS
    sources:
      - path: OpenCode
      - path: NativeRuntime
        type: folder
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ocmobile.ios
        SWIFT_OBJC_BRIDGING_HEADER: OpenCode/Runtime/ProcessBridge.h
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: TrollStore.entitlements
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  OpenCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: OpenCode
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OpenCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: OpenCode
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OpenCode
schemes:
  OpenCode:
    build:
      targets:
        OpenCode: all
        OpenCodeTests: [test]
        OpenCodeUITests: [test]
    test:
      targets: [OpenCodeTests, OpenCodeUITests]
