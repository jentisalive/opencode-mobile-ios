name: iOS native runtime
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  node:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      NODEJS_MOBILE_DIR: nodejs-mobile
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Justintunsday/opencode-ios
          ref: deb21deca5c430869ef98ae5e472d004481c680e
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nodejs-mobile/nodejs-mobile
          ref: 106c51f95d55d1010de56a2ffd09bfb4ba819a47
          path: nodejs-mobile
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: mobile
      - uses: actions/cache@v4
        id: cache
        with:
          path: dist/ios-node-runtime
          key: ios-node22-106c51f9-deb21dec-xcode16.4-${{ hashFiles('mobile/ios/runtime/patches/**') }}
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
        if: steps.cache.outputs.cache-hit != 'true'
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools
        if: steps.cache.outputs.cache-hit != 'true'
      - run: brew install ldid
        if: steps.cache.outputs.cache-hit != 'true'
      - uses: mozilla-actions/sccache-action@v0.0.6
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Apply pinned runtime patches
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for patch in "$GITHUB_WORKSPACE"/patches/nodejs-mobile/*.patch; do
            git -C nodejs-mobile apply --check "$patch"
            git -C nodejs-mobile apply "$patch"
          done
          for patch in "$GITHUB_WORKSPACE"/mobile/ios/runtime/patches/*.patch; do
            git -C nodejs-mobile apply --check "$patch"
            git -C nodejs-mobile apply "$patch"
          done
      - name: Build native iPhoneOS Node 22.9
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ios-runtime.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: ios-node-runtime
          path: dist/ios-node-runtime/
          if-no-files-found: error
          retention-days: 30
